<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Calendar - SnapVenture Admin</title>
    <link rel="stylesheet" href="../../css/calendar.css" />
    <link rel="stylesheet" href="../../css/booking-calendar.css" />
  </head>
  <body>
    <div class="admin-shell">
      <div class="admin-mobile">
        <b style="color: var(--brown)">SnapVenture Admin</b
        ><button class="btn btn-outline" data-admin-menu>☰</button>
      </div>
      <aside class="sidebar">
        <img class="logo" src="../../images/logo.png" />
        <p class="admin-label">Admin Panel</p>
        <nav class="admin-nav">
          <a href="dashboard.html" class=""><span>▦</span>Dashboard</a
          ><a href="bookings.html" class=""><span>◫</span>Bookings</a
          ><a href="calendar.html" class="active"><span>▣</span>Calendar</a
          ><a href="equipment.html" class=""><span>▤</span>Equipment</a
          ><a href="customers.html" class=""><span>♙</span>Customers</a
          ><a href="feedback.html" class=""><span>✉</span>Feedback</a
          ><a href="agreements.html" class=""><span>▤</span>Agreements</a
          ><a href="settings.html" class=""><span>⚙</span>Settings</a>
        </nav>
        <div class="sidebar-bottom">
          <a
            class="btn btn-outline"
            style="width: 100%; text-align: center"
            href="../../index.html"
            >↗ Back to Website</a
          >
          <br />
          <a
            class="btn btn-danger"
            style="width: 100%; text-align: center"
            href="login.html"
            >↪ Logout</a
          >
        </div>
      </aside>
      <main class="admin-content">
        <div class="admin-heading">
          <h1>Booking Calendar</h1>
          <p>View upcoming reservations at a glance.</p>
        </div>

        <div class="admin-card" id="adminCalendar" style="margin-top: 25px">
          <div class="cal-toolbar">
            <div>
              <h2 id="calTitle"></h2>
              <p class="cal-counts" id="calCounts"></p>
            </div>
            <div class="cal-controls">
              <button
                type="button"
                class="btn btn-outline btn-sm"
                id="calPrev"
                aria-label="Previous month"
              >
                ‹
              </button>
              <button
                type="button"
                class="btn btn-outline btn-sm"
                id="calToday"
              >
                Today
              </button>
              <button
                type="button"
                class="btn btn-outline btn-sm"
                id="calNext"
                aria-label="Next month"
              >
                ›
              </button>
            </div>
          </div>
          <div class="cal-scroll">
            <div class="cal-week">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span
              ><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="cal-grid" id="calGrid"></div>
          </div>
        </div>

        <div class="admin-card" id="calDetail"></div>
      </main>
    </div>
    <script src="../../js/booking-calendar.js"></script>
    <script src="../../script.js"></script>
  </body>
</html>
